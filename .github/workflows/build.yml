name: Build Release APK

# 自动构建：push 到 main 或打 tag（v*）时触发，也可手动触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 版本号自动生成：BUILD_DATE 注入 gradle，versionCode = run_number
      - name: Export build version
        run: echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      # 安卓 platform 系统签名（共签）：从 GitHub Secrets 读取 base64 密钥
      # 需在仓库 Settings → Secrets and variables → Actions 配置：
      #   PLATFORM_PK8_BASE64  = platform.pk8 的 base64 内容
      #   PLATFORM_PEM_BASE64  = platform.x509.pem 的 base64 内容
      - name: Restore platform signing keys
        env:
          PLATFORM_PK8_BASE64: ${{ secrets.PLATFORM_PK8_BASE64 }}
          PLATFORM_PEM_BASE64: ${{ secrets.PLATFORM_PEM_BASE64 }}
        run: |
          if [ -z "$PLATFORM_PK8_BASE64" ] || [ -z "$PLATFORM_PEM_BASE64" ]; then
            echo "::error::缺少签名密钥 Secrets：PLATFORM_PK8_BASE64 / PLATFORM_PEM_BASE64（base64 编码的 platform.pk8 / platform.x509.pem）"
            exit 1
          fi
          mkdir -p signing
          echo "$PLATFORM_PK8_BASE64" | base64 -d > signing/platform.pk8
          echo "$PLATFORM_PEM_BASE64" | base64 -d > signing/platform.x509.pem

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      # 固定使用安卓 platform 共签（AOSP 系统签名，v1+v2+v3）
      - name: Sign APK with platform key
        run: |
          SDK_BUILDTOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK_IN=app/build/outputs/apk/release/app-release-unsigned.apk
          APK_OUT=app/build/outputs/apk/release/WebDavMusicPlayer-${{ env.BUILD_DATE }}-r${{ github.run_number }}-signed.apk
          cp "$APK_IN" "$APK_OUT"
          "$SDK_BUILDTOOLS/apksigner" sign \
            --key signing/platform.pk8 \
            --cert signing/platform.x509.pem \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            "$APK_OUT"
          "$SDK_BUILDTOOLS/apksigner" verify --verbose "$APK_OUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDavMusicPlayer-${{ env.BUILD_DATE }}-r${{ github.run_number }}
          path: app/build/outputs/apk/release/*-signed.apk
          if-no-files-found: error

      # 打 tag（v*）时自动创建 GitHub Release 并附带签名 APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*-signed.apk)
          VERSION="${{ env.BUILD_DATE }}-r${{ github.run_number }}"
          gh release create "${{ github.ref_name }}" "$APK" \
            --title "WebDavMusicPlayer ${{ github.ref_name }} ($VERSION)" \
            --notes "自动构建版本：versionName=1.$VERSION, versionCode=${{ github.run_number }}。使用 AOSP platform 签名。"
