plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.webdav.music'
    compileSdk 34

    // 版本号自动生成：
    //  - CI（GitHub Actions）：versionCode = GITHUB_RUN_NUMBER（单调递增），
    //    versionName = 1.<date>.<run_number>，如 1.20261011.42
    //  - 本地构建回退：versionCode = 日期整数，versionName = 1.<date>.0
    def ciRun = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
    def buildDate = System.getenv("BUILD_DATE") ?: new Date().format("yyyyMMdd")
    def autoVersionCode = ciRun > 0 ? ciRun : buildDate.toInteger()
    def autoVersionName = "1.${buildDate}.${ciRun > 0 ? ciRun : 0}"

    defaultConfig {
        applicationId "com.webdav.music"
        minSdk 29
        targetSdk 34
        versionCode autoVersionCode
        versionName autoVersionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Media3 (ExoPlayer + MediaSession + OkHttp DataSource)
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation 'androidx.media3:media3-database:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'

    // 单元测试
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
